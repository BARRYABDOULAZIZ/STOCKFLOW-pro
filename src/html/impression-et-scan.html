<div class="toast" id="toast"></div>
<div id="netBar"></div>

<div id="printInvSheet"></div>
<div id="printTicket"></div>
<div id="printArea">
  <div class="pi-head">
    <div>
      <img id="pi-logo" alt="" style="display:none; max-height:70px; max-width:170px; margin-bottom:8px;">
      <h1 id="pi-title">Facture</h1>
      <div style="font-family:'Inter',sans-serif; font-size:15px; font-weight:800; margin-top:4px; color:var(--pi-accent, #1d4ed8);" id="pi-commerce-nom">BoromBoutik</div>
      <div style="font-family:'Inter',sans-serif; font-size:11px; color:#555;" id="pi-commerce-adresse"></div>
    </div>
    <div class="pi-meta"><div id="pi-num"></div><div id="pi-date"></div></div>
  </div>
  <div class="pi-client"><strong id="pi-client-lbl">Client :</strong> <span id="pi-client"></span></div>
  <table class="pi-table">
    <thead><tr><th>Référence</th><th>Désignation</th><th class="num-cell">Quantité</th><th>Unité</th><th class="num-cell">Prix</th><th class="num-cell">Total</th></tr></thead>
    <tbody id="pi-lines"></tbody>
  </table>
  <div id="pi-breakdown"></div>
  <div class="pi-total"><span id="pi-total-lbl">Total</span><span id="pi-total"></span></div>
  <div id="pi-lettres" style="font-family:'Inter',sans-serif; font-size:12px; font-style:italic; margin-top:6px; text-align:right; clear:both;"></div>
  <div id="pi-statut" style="margin-top:10px; text-align:right; font-family:'Inter',sans-serif; font-weight:700; font-size:14px; padding:6px 14px; border-radius:6px; display:inline-block; float:right;"></div>
  <div style="clear:both;"></div>
  <div id="pi-remarque" style="display:none; font-family:'Inter',sans-serif; font-size:12.5px; margin-top:14px; padding:8px 12px; border-left:3px solid var(--pi-accent, #1d4ed8); background:#f1f5f9;"></div>
  <div id="pi-pay" style="display:none;"></div>
  <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-top:36px;">
    <div id="pi-message" style="font-family:'Inter',sans-serif; font-size:13px; font-style:italic; color:#333; flex:1;"></div>
    <div id="pi-client-sign" style="display:none; text-align:center;">
      <div style="height:60px;"></div>
      <div style="font-family:'Inter',sans-serif; font-size:11px; border-top:1px solid #000; padding-top:3px; min-width:170px;" id="pi-client-sign-label">Bon pour accord (client)</div>
    </div>
    <div id="pi-signature-box" style="display:none; text-align:center;">
      <img id="pi-signature" alt="" style="max-height:80px; max-width:200px; display:block; margin:0 auto 4px;">
      <div style="font-family:'Inter',sans-serif; font-size:11px; border-top:1px solid #000; padding-top:3px; min-width:150px;" id="pi-signature-label">Signature / cachet</div>
    </div>
  </div>
</div>

<!-- Fenêtre de scan caméra universelle -->
<div id="globalScanModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center; padding:20px;">
  <div class="card" style="max-width:400px; width:100%; margin:0; background:var(--paper);">
    <div class="row-head">
      <h2 id="globalScanTitle">Scan caméra</h2>
      <button class="ghost" id="btnCloseGlobalScan">✕ Fermer</button>
    </div>
    <p class="hint-text" style="margin-top:0;">Pointe la caméra vers le code-barres.</p>
    <div style="max-width:100%; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); background:#000;">
      <video id="globalScanVideo" style="width:100%; display:block;" playsinline muted></video>
    </div>
    <p class="muted" id="globalScanStatus" style="margin-top:10px; text-align:center;"></p>
  </div>
</div>
